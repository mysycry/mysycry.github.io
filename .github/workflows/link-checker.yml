name: Link Checker

on:
  push:
    branches:
      - main
      - socmed
    paths:
      - "**/*.html"
      - "**/*.css"
      - "**/*.md"
      - "**/*.js"
      - ".github/workflows/link-checker.yml"
  pull_request:
    branches:
      - main
      - socmed
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

concurrency:
  group: link-checker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  link-checker:
    name: Check internal and external links
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install lychee
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/lycheeverse/lychee/releases/latest/download/lychee-x86_64-unknown-linux-gnu.tar.gz \
            | sudo tar xzf - -C /usr/local/bin lychee

      - name: Check links
        run: |
          lychee --verbose --no-progress \
            --max-retries 3 \
            --retry-wait-time 5 \
            --timeout 30 \
            --accept 200,204,206,403,429 \
            --exclude 'mailto:' \
            index.html README.md CLOUDFLARE_DEPLOY.md

      - name: Create link-check summary
        if: always()
        run: |
          {
            echo "## Link Checker"
            echo ""
            echo "Checked internal and external links in HTML and documentation."
          } >> "$GITHUB_STEP_SUMMARY"
