name: Link Checker

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "**/*.html"
      - "**/*.css"
      - "**/*.md"
      - "**/*.js"
      - ".github/workflows/link-checker.yml"
  pull_request:
    branches:
      - main
      - dev
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

concurrency:
  group: link-checker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  link-checker:
    name: Check internal and external links
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: >-
            --verbose --no-progress
            --max-retries 3
            --retry-wait-time 5
            --timeout 30
            --accept 200,204,206,403,429
            --exclude 'mailto:'
            --root-dir .
            index.html styles.css README.md docs/*.md
          fail: true

      - name: Verify social preview metadata
        shell: bash
        run: |
          set -euo pipefail

          expected_url="https://mysycry.github.io/images/portfolio-preview.png"
          expected_file="images/portfolio-preview.png"

          test -s "$expected_file"
          grep -F "<meta property=\"og:image\" content=\"$expected_url\">" index.html
          grep -F "<meta name=\"twitter:image\" content=\"$expected_url\">" index.html
          grep -F '<meta name="twitter:card" content="summary_large_image">' index.html

      - name: Create link-check summary
        if: always()
        run: |
          {
            echo "## Link Checker"
            echo ""
            echo "Checked internal and external links in HTML, CSS and documentation."
            echo "Verified Open Graph and Twitter preview metadata."
          } >> "$GITHUB_STEP_SUMMARY"
