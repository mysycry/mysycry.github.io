name: HTML/CSS Validation

on:
  push:
    branches:
      - main
      - idkanymore
    paths:
      - "**/*.html"
      - "**/*.css"
      - ".github/workflows/html-css-validation.yml"
  pull_request:
    branches:
      - main
      - idkanymore
    paths:
      - "**/*.html"
      - "**/*.css"
      - ".github/workflows/html-css-validation.yml"
  workflow_dispatch:

concurrency:
  group: html-css-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate HTML and CSS
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install validators
        run: npm install --global htmlhint stylelint stylelint-config-standard

      - name: Create Stylelint config
        run: |
          cat > .stylelintrc.json <<'EOF'
          {
            "extends": "stylelint-config-standard",
            "rules": {
              "alpha-value-notation": null,
              "at-rule-no-vendor-prefix": null,
              "block-no-empty": null,
              "color-function-alias-notation": null,
              "color-function-notation": null,
              "color-hex-length": null,
              "declaration-block-no-duplicate-properties": null,
              "declaration-block-no-shorthand-property-overrides": null,
              "declaration-block-single-line-max-declarations": null,
              "font-family-name-quotes": null,
              "font-family-no-missing-generic-family-keyword": null,
              "function-no-unknown": null,
              "hue-degree-notation": null,
              "keyframes-name-pattern": null,
              "length-zero-no-unit": null,
              "media-feature-range-notation": null,
              "no-descending-specificity": null,
              "no-duplicate-selectors": null,
              "no-invalid-double-slash-comments": null,
              "number-max-precision": null,
              "property-no-deprecated": null,
              "property-no-unknown": null,
              "property-no-vendor-prefix": null,
              "rule-empty-line-before": null,
              "selector-class-pattern": null,
              "selector-not-notation": null,
              "selector-pseudo-class-no-unknown": [true, {"ignorePseudoClasses": ["global"]}],
              "shorthand-property-no-redundant-values": null,
              "string-no-newline": null,
              "unit-no-unknown": null,
              "value-no-vendor-prefix": null
            }
          }
          EOF

      - name: Validate HTML
        run: htmlhint "index.html" --format unix

      - name: Validate CSS
        run: stylelint "styles.css" --formatter verbose

      - name: W3C HTML validation
        continue-on-error: true
        run: curl --fail --silent --show-error -F "out=gnu" -F "content=@index.html" https://validator.w3.org/nu/

      - name: W3C CSS validation
        continue-on-error: true
        run: curl --fail --silent --show-error -F "output=gnu" -F "file=@styles.css" https://jigsaw.w3.org/css-validator/validator

      - name: Create validation summary
        if: always()
        run: |
          {
            echo "## HTML/CSS Validation"
            echo ""
            echo "- HTMLHint: completed"
            echo "- Stylelint: completed"
            echo "- W3C validators: informational, because public validator APIs can be intermittent"
          } >> "$GITHUB_STEP_SUMMARY"
