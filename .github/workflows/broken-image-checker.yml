name: Broken Image Checker

on:
  push:
    branches:
      - main
      - socmed
    paths:
      - "**/*.html"
      - "**/*.css"
      - "**/*.md"
      - "images/**"
      - ".github/workflows/broken-image-checker.yml"
  pull_request:
    branches:
      - main
      - socmed
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

concurrency:
  group: broken-image-checker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-images:
    name: Check image references
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check local image files exist
        shell: bash
        run: |
          set -euo pipefail

          missing=0
          while IFS= read -r image; do
            image="${image%%\?*}"
            image="${image#/}"

            if [[ "$image" =~ ^https?:// ]]; then
              continue
            fi

            if [[ ! -f "$image" ]]; then
              echo "::error::Missing image reference: $image"
              missing=$((missing + 1))
            else
              echo "Found image: $image"
            fi
          done < <(
            grep -RhoP '(src|href|content)="\K[^"]+\.(jpg|jpeg|png|gif|webp|svg)(\?[^"]*)?' index.html README.md styles.css 2>/dev/null
            grep -RhoP '!\[[^]]*\]\(\K[^)]+\.(jpg|jpeg|png|gif|webp|svg)(\?[^)]*)?' README.md 2>/dev/null
          ) | sort -u

          if [[ "$missing" -gt 0 ]]; then
            exit 1
          fi

      - name: Check remote image URLs
        run: |
          curl --fail --location --silent --show-error --head --retry 3 --retry-delay 5 \
            "https://cdn-icons-png.flaticon.com/512/6024/6024820.png" >/dev/null

      - name: Create image-check summary
        if: always()
        run: |
          {
            echo "## Broken Image Checker"
            echo ""
            echo "Checked local image references and critical remote image URLs."
          } >> "$GITHUB_STEP_SUMMARY"
