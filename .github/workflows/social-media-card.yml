name: Social Media Metadata

on:
  push:
    branches:
      - main
      - socmed
    paths:
      - "index.html"
      - "images/portfolio-preview.png"
      - ".github/workflows/social-media-card.yml"
  pull_request:
    branches:
      - main
      - socmed
    paths:
      - "index.html"
      - "images/portfolio-preview.png"
      - ".github/workflows/social-media-card.yml"
  workflow_dispatch:

concurrency:
  group: social-media-metadata-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-social-metadata:
    name: Verify social metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify social preview metadata
        shell: bash
        run: |
          set -euo pipefail

          expected_url="https://josiasmichael.github.io/images/portfolio-preview.png"
          expected_file="images/portfolio-preview.png"

          test -s "$expected_file"
          grep -F "<meta property=\"og:image\" content=\"$expected_url\">" index.html
          grep -F "<meta name=\"twitter:image\" content=\"$expected_url\">" index.html
          grep -F '<meta name="twitter:card" content="summary_large_image">' index.html

      - name: Create metadata summary
        run: |
          {
            echo "## Social Media Metadata"
            echo ""
            echo "Open Graph and Twitter preview metadata point to the checked-in preview image."
          } >> "$GITHUB_STEP_SUMMARY"
