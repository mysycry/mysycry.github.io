name: Deploy Chat Worker

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "workers/**"
      - ".github/workflows/cloudflare-worker-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy chat worker
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Update npm
        run: npm install -g npm@latest

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_AI_API_TOKEN }}
          accountId: ${{ secrets.CF_AI_ACCOUNT_ID }}
          command: deploy --config workers/wrangler.toml --var CF_AI_ACCOUNT_ID:${{ secrets.CF_AI_ACCOUNT_ID }}

      - name: Set Worker AI secret
        run: |
          printenv CF_AI_API_TOKEN | npx --no-install wrangler secret put CF_AI_API_TOKEN --config workers/wrangler.toml
        env:
          CF_AI_API_TOKEN: ${{ secrets.CF_AI_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_AI_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_AI_ACCOUNT_ID }}

      - name: Create deployment summary
        if: always()
        run: |
          {
            echo "## Deploy Chat Worker"
            echo ""
            echo "portfolio chat worker deployed."
          } >> "$GITHUB_STEP_SUMMARY"
